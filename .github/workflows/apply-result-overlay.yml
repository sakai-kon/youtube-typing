name: Apply result overlay change

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!startsWith(github.event.head_commit.message, 'chore: apply result overlay change') && !startsWith(github.event.head_commit.message, 'feat: use overlay result screen')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update result screen
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/play/page.tsx')
          text = path.read_text(encoding='utf-8')

          old_jsx = '''{finished && <section className="play-stage result-stage"><div className="complete-badge">COMPLETE</div><div className="play-text">おつかれさまでした！</div><p className="muted">今回のプレイ結果</p><div className="result"><div className="stat"><b>{misses}</b><span>ミス</span></div><div className="stat"><b>{kpm}</b><span>KPM</span></div><div className="stat"><b>{accuracy}%</b><span>精度</span></div><div className="stat"><b>{lines.length}</b><span>行数</span></div></div><div className="cta-row"><button className="btn primary" onClick={resetGame}>もう一度プレイ</button><Link className="btn" href="/">トップへ</Link></div></section>}'''
          new_jsx = '''{finished && <section className="play-stage result-stage" role="dialog" aria-modal="true" aria-label="プレイ結果"><div className="complete-badge">COMPLETE</div><div className="play-text">おつかれさまでした！</div><p className="muted">今回のプレイ結果</p><div className="result"><div className="stat"><b>{misses}</b><span>ミス</span></div><div className="stat"><b>{kpm}</b><span>KPM</span></div><div className="stat"><b>{accuracy}%</b><span>精度</span></div><div className="stat"><b>{lines.length}</b><span>行数</span></div></div><div className="cta-row"><button className="btn primary" onClick={resetGame}>もう一度プレイ</button><Link className="btn" href="/">トップへ</Link></div></section>}'''

          if old_jsx not in text:
              raise SystemExit('result JSX target not found')
          text = text.replace(old_jsx, new_jsx, 1)

          old_css = '''        .play-game-page{max-width:1280px;padding-top:28px;padding-bottom:48px}\n'''
          new_css = '''        .play-game-page{max-width:1280px;padding-top:28px;padding-bottom:48px}\n        .result-stage{position:fixed;inset:0;z-index:100;width:100vw;height:100dvh;min-height:100dvh;margin:0;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:auto;border:0;border-radius:0;background:rgba(3,5,9,.76);box-shadow:none;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.result-stage::before{content:"";position:absolute;left:50%;top:50%;width:min(720px,calc(100vw - 32px));height:min(560px,calc(100dvh - 32px));transform:translate(-50%,-50%);border:1px solid #ffffff16;border-radius:24px;background:linear-gradient(180deg,rgba(19,25,35,.98),rgba(9,13,19,.99));box-shadow:0 28px 90px #000b, inset 0 1px 0 #ffffff08;pointer-events:none}.result-stage>*{position:relative;z-index:1}.result-stage .play-text{font-size:clamp(30px,4.5vw,56px)}.result-stage .result{width:min(540px,100%)}.result-stage .cta-row{justify-content:center;margin-top:4px}\n'''
          if old_css not in text:
              raise SystemExit('play page style anchor not found')
          text = text.replace(old_css, new_css, 1)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-result-overlay.yml')
          workflow.unlink(missing_ok=True)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/play/page.tsx .github/workflows/apply-result-overlay.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: use overlay result screen [skip ci]"
          git push