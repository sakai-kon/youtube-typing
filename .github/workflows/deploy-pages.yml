name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-site
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /youtube-typing
  NEXT_PUBLIC_SUPABASE_URL: https://kfoaphvuwhksdpclfzna.supabase.co

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Publish static files to main for branch-based Pages
        run: |
          cp -R out/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html _next admin copyright create login play profile search
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
            exit 0
          fi
          git commit -m "chore: publish static site [skip ci]"
          git push origin HEAD:main
