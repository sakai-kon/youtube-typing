name: Sync static export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[static-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build current Next.js export
        run: |
          npm install
          NEXT_PUBLIC_BASE_PATH=/youtube-typing NEXT_PUBLIC_SUPABASE_URL=https://kfoaphvuwhksdpclfzna.supabase.co npm run build

      - name: Replace committed static export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          out = root / 'out'

          for item in out.iterdir():
              target = root / item.name
              if target.exists():
                  if target.is_dir():
                      shutil.rmtree(target)
                  else:
                      target.unlink()
              if item.is_dir():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Verify generated app
        run: |
          test -f play/index.html
          grep -q 'YouTube Typing' play/index.html
          ! grep -q 'Space でスキップ' play/index.html

      - name: Commit current export
        run: |
          rm -rf out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: sync committed static export [static-sync]"
          git push
